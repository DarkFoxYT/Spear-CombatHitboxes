plugins {
    id 'fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.properties(version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version)
    filesMatching("fabric.mod.json") { expand inputs.properties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
java { withSourcesJar() }
jar { from('LICENSE.txt') }
